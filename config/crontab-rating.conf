# =============================================================================
# crontab-rating.conf — 评分系统（方案C）定时任务配置（P0-3 / KA-18）
# =============================================================================
# 生产路径: <WORKSPACE>/prod/rating-system/
#   本机: /Users/kzh/multica_workspaces_desktop-api.multica.ai/e3ad92f3-ad8e-4eba-bce9-3e670bc345a3/prod/rating-system
# 时区: Asia/Shanghai
# 执行方式: Multica autopilot（schedule trigger）→ 派发 issue 给 DevOps自动化工程师 →
#           agent 按任务提示运行本文件对应的包装脚本
# 验收状态: cron 可见 ✅ / 手动触发 ✅ / 失败告警 ✅ / 幂等对齐 ✅
# =============================================================================

# -----------------------------------------------------------------------------
# 0. 状态变更钩子（P2-11 / KA-76）— 每日 00:20 结算前
# -----------------------------------------------------------------------------
# cron:   20 0 * * *   (Asia/Shanghai，北京时间每日 00:20，先于 00:30 结算)
# 脚本:   scripts/run-state-change-hook.sh
# 核心:   python3 agents/capability-system/state-change-hook.py
# 职责:   检测任务 完成/失败/返工 状态变更 → 自动写事件 metadata（rating.status=pending）
# 事件:   R-01 按时完成 +20 / R-02 超时完成 +10 / R-03 未完成失败 -15 / R-04 退回返工 -10
# 日志:   logs/hook/YYYY-MM-DD.log
# 幂等:   rating.last_status 状态跟踪；首次运行自动建 baseline（存量不触发）；
#         已有 pending 事件延后、同事件已入账跳过（结算器 E_DUP 兜底）
# 告警:   退出码非 0 → 钩子失败告警（见 runbook.md 第 3 节）
# 依赖:   必须先于结算运行（00:30），保证当日变更当日入账
# autopilot id: 4b188928-b66d-4532-929b-06b25860291e（trigger a2b35bdc-1d3e-4d4f-8061-ca90ffc75fc5，KA-108 接线）

# -----------------------------------------------------------------------------
# 1. 每日 00:30 结算
# -----------------------------------------------------------------------------
# cron:   30 0 * * *   (Asia/Shanghai，北京时间每日 00:30)
# 脚本:   scripts/run-daily-settlement.sh
# 核心:   python3 agents/capability-system/rating-settler.py
# 日志:   logs/settlement/YYYY-MM-DD.log
# 幂等:   pending→credited 状态机，重复运行只处理仍为 pending 的流水（E_DUP 跳过）
# 告警:   退出码非 0 → 结算失败告警（见 runbook.md 第 3 节）
# autopilot id: 1beb812e-bf4c-4273-9fb1-712320b84a5c（trigger fe0b20be-d831-4ce8-a1dd-d8f380616500）

# -----------------------------------------------------------------------------
# 2. 月末聚合（月度 R-41 / 季度 R-51）
# -----------------------------------------------------------------------------
# cron:   15 1 28-31 * *   (Asia/Shanghai，每月 28-31 日 01:15 触发)
# 守卫:   仅当月最后一天执行，其余日期 skip 记日志（幂等 no-op）
# 脚本:   scripts/run-monthly-aggregation.sh
# 核心:   python3 agents/capability-system/rating-aggregator.py
# 日志:   logs/aggregation/YYYY-MM-DD.log
# 幂等:   聚合输出为事件流水的纯函数，重复运行结果一致（无变化跳过）
# 告警:   退出码非 0 → 聚合失败告警（见 runbook.md 第 3 节）
# autopilot id: 1fda0bde-db15-42a1-a260-fb0569a571df（trigger a9219c4c-eff8-417d-b7a9-8c467eb75fca）

# -----------------------------------------------------------------------------
# 3. 季度人评触发（季度末窗口：3/6/9/12 月最后 3 天）
# -----------------------------------------------------------------------------
# cron:   15 2 29-31 3,6,9,12 *   (Asia/Shanghai，季度末月 29-31 日 02:15 触发)
# 守卫:   仅季度末月最后 3 天执行，其余日期 skip 记日志（幂等 no-op）
# 脚本:   scripts/run-quarterly-review.sh
# 核心:   bash agents/capability-system/review-scheduler.sh --quarterly
# 日志:   logs/review/YYYY-MM-DD.log
# 幂等:   review-scheduler.sh 对已存在的季度人评表单不再生成（[ ! -f ] 守卫）
# 告警:   退出码非 0 → 人评触发失败告警（见 runbook.md 第 3 节）
# autopilot id: ec590ab3-0f6c-4776-bbc7-c7007865d580（trigger b62dafc2-7ef7-493c-b8b6-ae77d59b83bd）

# -----------------------------------------------------------------------------
# 日志与告警配置（统一）
# -----------------------------------------------------------------------------
# 日志目录: logs/{settlement,aggregation,review}/YYYY-MM-DD.log
#   - 每次运行以时间戳起止 + exit code 包裹，可追溯
# 告警路径（降级）:
#   L1 脚本失败    → 运行 agent 在本 job issue 评论告警 + 创建「评分定时任务失败」issue（P1，@SRE）
#   L2 24h 未处置  → 升级资深战略领导者（escalated SLA 48h）
#   L3 静默失火    → 每日监控发现「该日无日志/无 run」→ 补触发 + 告警
# 详见 runbook.md
